<svg xmlns="http://www.w3.org/2000/svg" width="821" height="243" viewBox="0 0 821 243">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#000"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill:#000; }
      .small { font-size:14px; }
      .med { font-size:16px; }
      .title { font-size:18px; font-weight:700; }
      .ad { font-size:24px; font-weight:700; }
      .boxtext { font-size:14px; font-weight:700; }
    </style>
  </defs>

  <!-- Outer rounded frame -->
  <rect x="3" y="4" width="814" height="235" rx="18" ry="18"
        fill="#fff" stroke="#222" stroke-width="1.2"/>

  <!-- Winbind container -->
  <rect x="159" y="15" width="398" height="214" rx="22" ry="22"
        fill="#efefef" stroke="none"/>

  <text x="358" y="43" text-anchor="middle" class="label title">Winbind</text>

  <!-- Active Directory container -->
  <rect x="616" y="37" width="191" height="171" rx="14" ry="14"
        fill="#efefef" stroke="none"/>
  <text x="712" y="120" text-anchor="middle" class="label ad">Active</text>
  <text x="712" y="146" text-anchor="middle" class="label ad">Directory</text>

  <!-- Left blue labels -->
  <rect x="16" y="65" width="116" height="39" fill="#8db9e8" stroke="none"/>
  <text x="74" y="89" text-anchor="middle" class="label boxtext">Authentication</text>

  <rect x="16" y="165" width="116" height="39" fill="#8db9e8" stroke="none"/>
  <text x="74" y="180" text-anchor="middle" class="label boxtext">ID Tracking/</text>
  <text x="74" y="195" text-anchor="middle" class="label boxtext">Name Resolution</text>

  <!-- pam_winbind oval -->
  <ellipse cx="270" cy="83" rx="67" ry="22"
           fill="#ef7d7d" stroke="#555" stroke-width="1.2"/>
  <text x="270" y="88" text-anchor="middle" class="label small">pam_winbind</text>

  <!-- nss_winbind oval -->
  <ellipse cx="270" cy="182" rx="67" ry="22"
           fill="#ef7d7d" stroke="#555" stroke-width="1.2"/>
  <text x="270" y="187" text-anchor="middle" class="label small">nss_winbind</text>

  <!-- Kerberos box -->
  <rect x="435" y="72" width="79" height="23" fill="#fff8cc" stroke="#555" stroke-width="1"/>
  <text x="474.5" y="88" text-anchor="middle" class="label med">Kerberos</text>

  <!-- ID mapping dotted group -->
  <rect x="382" y="102" width="167" height="112"
        fill="none" stroke="#444" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- ID Mapping blue box -->
  <rect x="415" y="110" width="116" height="39" fill="#8db9e8" stroke="none"/>
  <text x="473" y="135" text-anchor="middle" class="label boxtext">ID Mapping</text>

  <!-- idmap backend oval -->
  <ellipse cx="473" cy="183" rx="67" ry="22"
           fill="#ef7d7d" stroke="#555" stroke-width="1.2"/>
  <text x="473" y="178" text-anchor="middle" class="label small">idmap</text>
  <text x="473" y="193" text-anchor="middle" class="label small">"backend"</text>

  <!-- Arrows -->
  <line x1="132" y1="84" x2="202" y2="84" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="337" y1="83" x2="434" y2="83" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="514" y1="83" x2="619" y2="83" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/>

  <line x1="132" y1="184" x2="202" y2="184" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="337" y1="183" x2="404" y2="183" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="540" y1="183" x2="615" y2="183" stroke="#000" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
