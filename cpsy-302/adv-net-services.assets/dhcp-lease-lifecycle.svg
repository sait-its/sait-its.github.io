<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <!-- Hatch pattern for the Renewal Period in Lease 1 -->
    <pattern id="hatch-gray" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#4a5568" stroke-width="2" />
    </pattern>

    <!-- Hatch pattern for the Rebinding Period (Orange) -->
    <pattern id="hatch-orange" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#d97706" stroke-width="2.5" />
    </pattern>

    <!-- Stopwatch icon symbol -->
    <g id="stopwatch">
      <circle cx="12" cy="13" r="8" fill="none" stroke="#222" stroke-width="1.8" />
      <path d="M12 5 V2 M10 2 H14" stroke="#222" stroke-width="1.8" stroke-linecap="round" />
      <path d="M17.5 7.5 L19.5 5.5" stroke="#222" stroke-width="1.8" stroke-linecap="round" />
      <polyline points="12,9 12,13 14.5,13" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #1f2937;
    }
    .label-title { font-size: 13px; font-weight: 600; }
    .label-sub { font-size: 12px; fill: #374151; }
    .label-time { font-size: 11px; fill: #4b5563; }
    .bar-text-title { font-size: 15px; font-weight: 600; text-anchor: middle; fill: #111827; }
    .bar-text-sub { font-size: 14px; font-weight: 500; text-anchor: middle; fill: #1f2937; }
    .axis-num { font-size: 15px; font-weight: 500; text-anchor: middle; }
    .bold-num { font-weight: 700; }
    .axis-title { font-size: 13px; font-weight: 600; }
    .line-tick { stroke: #111827; stroke-width: 2.5; stroke-linecap: square; }
    .dashed-line { stroke: #374151; stroke-width: 1.5; stroke-dasharray: 4, 4; }
    .timeline-axis { stroke: #111827; stroke-width: 2; }
    .pointer-line { stroke: #c2410c; stroke-width: 1.5; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Vertical dashed line at Renewal execution (Minute 35) -->
  <line x1="418" y1="65" x2="418" y2="475" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4, 4" />

  <!-- ==================== LEASE 1 (TOP) ==================== -->
  <g transform="translate(0, 0)">
    <!-- T1 / T2 Labels & Timing lines -->
    <text x="50" y="42" class="label-title">Renewal T1</text>
    <text x="50" y="58" class="label-sub">50% of Leasetime</text>
    <use href="#stopwatch" x="175" y="38" />
    <line x1="198" y1="51" x2="368" y2="51" class="dashed-line" />
    <text x="283" y="44" class="label-time" text-anchor="middle">30 minutes</text>

    <text x="50" y="94" class="label-title">Rebinding T2</text>
    <text x="50" y="110" class="label-sub">87.5% of Leasetime</text>
    <use href="#stopwatch" x="175" y="90" />
    <line x1="198" y1="103" x2="520" y2="103" class="dashed-line" />
    <text x="360" y="96" class="label-time" text-anchor="middle">52 minutes</text>

    <!-- Normal Operation Box: 0 to 30 min (width 180) -->
    <rect x="188" y="130" width="180" height="65" fill="#cbe6f4" stroke="#1f2937" stroke-width="1.5" />
    <text x="278" y="158" class="bar-text-title">Normal</text>
    <text x="278" y="177" class="bar-text-title">Operation</text>

    <!-- Renewal Period Box: 30 to 52 min (width 150) -->
    <rect x="368" y="130" width="150" height="65" fill="#dce6c8" stroke="#1f2937" stroke-width="1.5" />
    <rect x="368" y="130" width="150" height="65" fill="url(#hatch-gray)" stroke="#1f2937" stroke-width="1.5" />
    <text x="443" y="158" class="bar-text-sub">Renewal</text>
    <text x="443" y="177" class="bar-text-sub">Period</text>

    <!-- Rebinding Period Box: 52 to 60 min (width 34) -->
    <rect x="518" y="130" width="34" height="65" fill="#fef3c7" stroke="#ea580c" stroke-width="1.8" />
    <rect x="518" y="130" width="34" height="65" fill="url(#hatch-orange)" stroke="#ea580c" stroke-width="1.8" />

    <!-- Rebinding Period Pointer Callout -->
    <path d="M555,130 L595,75 V130" fill="none" class="pointer-line" />
    <text x="608" y="92" class="bar-text-title" style="text-anchor: start;">Rebinding</text>
    <text x="608" y="112" class="bar-text-title" style="text-anchor: start;">Period</text>

    <!-- Lease 1 Axis Ticks and Numbers -->
    <text x="80" y="222" class="axis-title">Leasetime</text>
    
    <line x1="188" y1="195" x2="188" y2="216" class="line-tick" />
    <text x="188" y="228" class="axis-num">0</text>

    <line x1="368" y1="195" x2="368" y2="216" class="line-tick" />
    <text x="368" y="228" class="axis-num">30 min</text>

    <!-- Minute 35 tick (orange) -->
    <line x1="418" y1="195" x2="418" y2="216" stroke="#d97706" stroke-width="2.5" />
    <text x="418" y="228" class="axis-num bold-num">35</text>

    <line x1="518" y1="195" x2="518" y2="216" class="line-tick" />
    <text x="518" y="228" class="axis-num">52</text>

    <line x1="552" y1="195" x2="552" y2="216" class="line-tick" />
    <text x="572" y="228" class="axis-num">60 min</text>
  </g>

  <!-- ==================== LEASE 2 (BOTTOM) ==================== -->
  <g transform="translate(0, 70)">
    <!-- T1 / T2 Labels & Timing lines -->
    <text x="285" y="197" class="label-title">Renewal T1</text>
    <text x="285" y="213" class="label-sub">50% of Leasetime</text>
    <use href="#stopwatch" x="408" y="193" />
    <line x1="431" y1="206" x2="598" y2="206" class="dashed-line" />
    <text x="515" y="199" class="label-time" text-anchor="middle">30 minutes</text>

    <text x="285" y="249" class="label-title">Rebinding T2</text>
    <text x="285" y="265" class="label-sub">87.5% of Leasetime</text>
    <use href="#stopwatch" x="408" y="245" />
    <line x1="431" y1="258" x2="750" y2="258" class="dashed-line" />
    <text x="590" y="251" class="label-time" text-anchor="middle">52 minutes</text>

    <!-- Normal Operation Box: Starts at 35 min (x=418), width 180 (30 min) -->
    <rect x="418" y="285" width="180" height="65" fill="#cbe6f4" stroke="#1f2937" stroke-width="1.5" />
    <text x="508" y="313" class="bar-text-title">Normal</text>
    <text x="508" y="332" class="bar-text-title">Operation</text>

    <!-- Renewal Period Box: width 150 (22 min) -->
    <rect x="598" y="285" width="150" height="65" fill="#dce6c8" stroke="#1f2937" stroke-width="1.5" />
    <text x="673" y="313" class="bar-text-sub">Renewal</text>
    <text x="673" y="332" class="bar-text-sub">Period</text>

    <!-- Rebinding Period Box: width 34 (8 min) -->
    <rect x="748" y="285" width="34" height="65" fill="#fef3c7" stroke="#ea580c" stroke-width="1.8" />
    <rect x="748" y="285" width="34" height="65" fill="url(#hatch-orange)" stroke="#ea580c" stroke-width="1.8" />

    <!-- Rebinding Period Pointer Callout -->
    <path d="M785,285 L825,230 V285" fill="none" class="pointer-line" />
    <text x="838" y="247" class="bar-text-title" style="text-anchor: start;">Rebinding</text>
    <text x="838" y="267" class="bar-text-title" style="text-anchor: start;">Period</text>

    <!-- Lease 2 Axis Ticks and Numbers -->
    <text x="310" y="377" class="axis-title">Leasetime</text>

    <line x1="418" y1="350" x2="418" y2="371" class="line-tick" />
    <text x="418" y="383" class="axis-num">0</text>

    <line x1="598" y1="350" x2="598" y2="371" class="line-tick" />
    <text x="598" y="383" class="axis-num">30 min</text>

    <line x1="748" y1="350" x2="748" y2="371" class="line-tick" />
    <text x="748" y="383" class="axis-num">52</text>

    <line x1="782" y1="350" x2="782" y2="371" class="line-tick" />
    <text x="802" y="383" class="axis-num">60 min</text>
  </g>

  <!-- ==================== GLOBAL TIMELINE (BOTTOM) ==================== -->
  <g transform="translate(0, 460)">
    <line x1="188" y1="15" x2="815" y2="15" class="timeline-axis" />

    <text x="55" y="10" class="axis-title">Timeline in</text>
    <text x="55" y="27" class="axis-title">minutes</text>

    <!-- 0 min -->
    <text x="194" y="42" class="axis-num">0</text>

    <!-- 30 min -->
    <text x="368" y="42" class="axis-num">30 min</text>

    <!-- 35 min -->
    <text x="418" y="42" class="axis-num bold-num">35</text>

    <!-- 60 min -->
    <text x="545" y="42" class="axis-num">60</text>

    <!-- 65 min -->
    <text x="612" y="42" class="axis-num">65</text>

    <!-- 90 min -->
    <text x="736" y="42" class="axis-num">90</text>

    <!-- 95 min -->
    <text x="792" y="42" class="axis-num">95 min</text>
  </g>
</svg>